[package]
name = "enthuse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "enthuse"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
enthuse-core.workspace = true
enthuse-player.workspace = true
glow = "0.18.0"
rfd = "0.18.0"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030", "raw-window-handle-06"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[build-dependencies]
slint-build = "1.19"
