[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/mtaanquist/enthuse"

[workspace.dependencies]
enthuse-core = { path = "crates/enthuse-core" }
enthuse-player = { path = "crates/enthuse-player" }
directories = "6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
