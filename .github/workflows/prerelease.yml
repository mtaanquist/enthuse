name: Pre-release

# Builds Windows and Linux packages from every push to a staging branch and
# publishes them as a GitHub pre-release, so the app can be tried without a
# Rust toolchain. Each staging branch has one rolling pre-release (tag
# `prerelease-<branch>`) that is replaced on every push. Pushing a version
# tag (`v0.1.0`) builds the same packages and publishes them as that
# release, with the notes from `docs/releases/<tag>.md`. If that release
# already exists (e.g. made by hand on GitHub), the packages are added to
# it and its notes are kept. To build packages for an existing tag whose
# commit predates this workflow, run it by hand from main with `tag` set. Linux packages are
# built on Ubuntu 24.04 rather than ubuntu-latest, so they also run on distributions
# with an older glibc.

on:
  push:
    branches: ["staging/**"]
    tags: ["v*"]
  # Pull requests only build the packages, so changes here can be checked
  # before they publish anything.
  pull_request:
    branches: [main, "staging/**"]
    paths: [".github/workflows/prerelease.yml", ".github/scripts/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach packages to (e.g. v0.1.0). Empty: pre-release of the selected branch."
        required: false
        default: ""

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The version tag being released, or empty for a staging pre-release.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # "release" for a version tag, else "pre-release"; used in README.txt.
  KIND: ${{ (inputs.tag || github.ref_type == 'tag') && 'release' || 'pre-release' }}
  # Keep in step with ci.yml.
  MPV_WINBUILD_TAG: "20261111"

jobs:
  build:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds the tagged commit, also when run by hand.
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libfontconfig1-dev libxkbcommon-dev

      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libmpv
          key: libmpv-${{ runner.os }}-${{ env.MPV_WINBUILD_TAG || github.run_id }}

      - name: Fetch libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-libmpv.ps1 -Dest "${{ runner.temp }}/libmpv" -Tag "${{ env.MPV_WINBUILD_TAG }}"

      - uses: Swatinem/rust-cache@v2
        with:
          # The default key only names "Linux", so without this a cache built
          # on another Ubuntu version (and glibc) would be restored here.
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --release -p enthuse-app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=enthuse-linux-x86_64
          mkdir -p "$dir"
          cp target/release/enthuse LICENSE "$dir"/
          cat > "$dir"/README.txt <<EOF
          Enthuse $KIND for Linux (x86_64).

          Needs libmpv from your distribution:
            Debian/Ubuntu: sudo apt install libmpv2
            Fedora:        sudo dnf install mpv-libs
            Arch:          sudo pacman -S mpv

          Run: ./enthuse [folder...]
          EOF
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "enthuse-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\enthuse.exe, LICENSE -Destination $dir
          Get-ChildItem "${{ runner.temp }}/libmpv" -Filter "libmpv-*.dll" |
            Copy-Item -Destination $dir
          @(
            "Enthuse $env:KIND for Windows (x86_64).",
            "",
            "Unzip anywhere and run enthuse.exe. libmpv is included",
            "(from https://github.com/shinchiro/mpv-winbuild-cmake, GPL)."
          ) | Set-Content "$dir\README.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: enthuse-${{ runner.os }}
          path: |
            enthuse-*.tar.gz
            enthuse-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release notes come from the workflow's own ref, so a hand run from
      # main finds notes added after the tag. Checkout cleans the workspace,
      # so it runs before the packages are downloaded.
      - uses: actions/checkout@v4
        if: env.RELEASE_TAG != ''
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Name the assets after the version, e.g. enthuse-0.1.0-windows-x86_64.zip.
          for f in dist/enthuse-*; do
            mv "$f" "dist/enthuse-${TAG#v}-${f#dist/enthuse-}"
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Made by hand: add the packages and keep its title and notes.
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes $notes"
            exit 1
          fi
          # 0.x versions are early releases, but still the latest release.
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Enthuse $TAG" \
            --notes-file "$notes"

      - name: Publish pre-release
        if: env.RELEASE_TAG == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          slug="${BRANCH#staging/}"
          slug="${slug//\//-}"
          tag="prerelease-$slug"
          short="${GITHUB_SHA::7}"
          notes="Automatic pre-release of \`$BRANCH\` at $GITHUB_SHA ($(date -u +%Y-%m-%d)).

          Replaced on every push to the branch. Not a stable release.

          - Windows: unzip and run \`enthuse.exe\` (libmpv included).
          - Linux: needs libmpv from your distribution (see README.txt)."
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Enthuse $slug ($short)" \
            --notes "$notes"
