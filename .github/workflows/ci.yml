name: CI

on:
  push:
    branches: [main, "staging/**"]
  pull_request:
    branches: [main, "staging/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release tag of https://github.com/shinchiro/mpv-winbuild-cmake used for
  # the Windows libmpv dev package. Empty means "latest" (printed in the log).
  MPV_WINBUILD_TAG: ""

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libfontconfig1-dev libxkbcommon-dev

      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libmpv
          key: libmpv-${{ runner.os }}-${{ env.MPV_WINBUILD_TAG || github.run_id }}

      - name: Fetch libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-libmpv.ps1 -Dest "${{ runner.temp }}/libmpv" -Tag "${{ env.MPV_WINBUILD_TAG }}"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
